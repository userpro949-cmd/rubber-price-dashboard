name: Update Rubber Prices

on:
  schedule:
    # Runs daily at 06:00 UTC (~11:30am Sri Lanka time). Cheap to run daily
    # since the script exits immediately when there's nothing new.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Check for new auction data
        run: python scripts/scrape.py

      - name: OCR the new image (if any)
        run: python scripts/ocr_extract.py

      - name: Commit and push if data changed
        run: |
          git config user.name "rubber-price-bot"
          git config user.email "actions@github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update rubber prices $(date -u +%Y-%m-%d)"
            git push
          fi
